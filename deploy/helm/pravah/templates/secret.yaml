apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pravah.fullname" . }}-secrets
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.razorpayKeyId }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.razorpayKeySecret }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | quote }}
  {{- end }}
  {{- if .Values.secrets.cashfreeAppId }}
  CASHFREE_APP_ID: {{ .Values.secrets.cashfreeAppId | quote }}
  {{- end }}
  {{- if .Values.secrets.cashfreeSecretKey }}
  CASHFREE_SECRET_KEY: {{ .Values.secrets.cashfreeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpUser }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
