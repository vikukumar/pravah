# ==============================================================================
# PRAVAH Helm Chart Values Specification
# Production-ready configuration for Kubernetes Workloads, Services, and Ingress
# ==============================================================================

global:
  imageRegistry: "ghcr.io"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

# ------------------------------------------------------------------------------
# Backend API Workload Configuration
# ------------------------------------------------------------------------------
api:
  replicaCount: 2
  image:
    repository: "vikukumar/pravah-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 25
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# ------------------------------------------------------------------------------
# Web Frontend Workload Configuration
# ------------------------------------------------------------------------------
web:
  replicaCount: 2
  image:
    repository: "vikukumar/pravah-web"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# ------------------------------------------------------------------------------
# Background Scheduler Worker Workload Configuration
# ------------------------------------------------------------------------------
scheduler:
  enabled: true
  replicaCount: 1
  image:
    repository: "vikukumar/pravah-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

# ------------------------------------------------------------------------------
# Persistent Volume Claim for Uploads & Content Media
# ------------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteMany # or ReadWriteOnce for single-node
  size: 20Gi
  mountPath: /app/uploads
  annotations: {}

# ------------------------------------------------------------------------------
# Ingress Controller Configuration
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: pravah.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
          service: api
        - path: /uploads
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: pravah-tls-cert
      hosts:
        - pravah.example.com

# ------------------------------------------------------------------------------
# Horizontal Pod Autoscaling (HPA)
# ------------------------------------------------------------------------------
autoscaling:
  enabled: false
  api:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  web:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# ServiceAccount
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ------------------------------------------------------------------------------
# Application Environment & Database Configuration
# ------------------------------------------------------------------------------
config:
  environment: "production"
  appUrl: "https://pravah.example.com"
  apiUrl: "https://pravah.example.com/api/v1"
  storageType: "local"

  # PostgreSQL connection strings
  databaseUrl: "postgresql+asyncpg://pravah_user:pravah_password@postgres-service:5432/pravah_prod_db"
  databaseSyncUrl: "postgresql://pravah_user:pravah_password@postgres-service:5432/pravah_prod_db"

  # Redis URL
  redisUrl: "redis://redis-service:6379/0"

  # SMTP
  smtpHost: "smtp.gmail.com"
  smtpPort: 587
  smtpFromEmail: "noreply@pravah.app"
  smtpFromName: "PRAVAH Platform"
  smtpTls: true

# ------------------------------------------------------------------------------
# Sensitive Secrets (Recommend injecting via external secret store or SealedSecrets)
# ------------------------------------------------------------------------------
secrets:
  secretKey: "pravah_production_super_secret_key_32_characters_minimum"
  encryptionKey: "ZXZhbHVhdGlvbl9lbmNyeXB0aW9uX2tleV9mb3JfcHJhdmFoX3NlY3VyZQ=="
  openrouterApiKey: ""
  razorpayKeyId: ""
  razorpayKeySecret: ""
  cashfreeAppId: ""
  cashfreeSecretKey: ""
  smtpUser: ""
  smtpPassword: ""
