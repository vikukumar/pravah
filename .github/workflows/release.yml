name: Release & Publish Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer increment level (auto detects from commit history)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Custom version string (e.g. 1.1.0) if bump_type=custom'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Check out repository with full commit history for tags and changelog extraction
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python runtime
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Set up Node.js runtime for web validation
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # 4. Automated SemVer calculation & changelog generation
      - name: Resolve Semantic Version & Generate Changelog
        id: semver
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/release_version.py \
            --bump-type "${{ github.event.inputs.bump_type || 'auto' }}" \
            --custom-version "${{ github.event.inputs.custom_version || '' }}" \
            --notes-file "dist/RELEASE_NOTES.md"

      # 5. Build secure standalone distribution ZIP artifact (No Actions Storage used)
      - name: Package Standalone Distribution Archive
        id: package
        run: |
          python scripts/package_release.py \
            --version "${{ steps.semver.outputs.version }}" \
            --output-dir "dist"

      # 6. Set up QEMU for multi-platform container compilation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. Set up Docker Buildx with GitHub Actions caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Extract Docker Metadata for Unified Container
      - name: Extract Docker Metadata (Unified All-in-One)
        id: meta_unified
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=PRAVAH
            org.opencontainers.image.description=Enterprise AI Workflow Automation & Social Media Platform
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 10. Build and Push Unified All-in-One Docker Image
      - name: Build & Push Unified Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta_unified.outputs.tags }}
          labels: ${{ steps.meta_unified.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 11. Build and Push Modular Backend API Docker Image
      - name: Build & Push Modular API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ steps.semver.outputs.version }}
            ghcr.io/${{ github.repository }}-api:latest
          labels: ${{ steps.meta_unified.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 12. Build and Push Modular Web Frontend Docker Image
      - name: Build & Push Modular Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ steps.semver.outputs.version }}
            ghcr.io/${{ github.repository }}-web:latest
          labels: ${{ steps.meta_unified.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 13. Set up Helm CLI
      - name: Set up Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 14. Package Helm Chart
      - name: Package Helm Chart
        run: |
          # Sync chart version and appVersion
          sed -i 's/^version: .*/version: '${{ steps.semver.outputs.version }}'/' deploy/helm/pravah/Chart.yaml
          sed -i 's/^appVersion: .*/appVersion: "'${{ steps.semver.outputs.version }}'"/' deploy/helm/pravah/Chart.yaml
          
          # Package chart to dist/
          helm package deploy/helm/pravah \
            --version "${{ steps.semver.outputs.version }}" \
            --app-version "${{ steps.semver.outputs.version }}" \
            --destination "dist"
          
          CHART_TGZ="dist/pravah-${{ steps.semver.outputs.version }}.tgz"
          if [ -f "$CHART_TGZ" ]; then
            # Append SHA256 checksum to SHA256SUMS.txt
            sha256sum "$CHART_TGZ" | awk '{print $1 "  pravah-'${{ steps.semver.outputs.version }}'.tgz"}' >> dist/SHA256SUMS.txt
          fi

      # 15. Commit updated version files and push Git Tag
      - name: Commit Version Bump & Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage version files and chart definitions
          git add version.json \
                  apps/api/app/__init__.py \
                  apps/web/package.json \
                  apps/web/lib/version.ts \
                  packages/shared-types/package.json \
                  deploy/helm/pravah/Chart.yaml
          
          # Commit if changes exist
          if git diff --staged --quiet; then
            echo "Version files already up to date."
          else
            git commit -m "chore(release): bump platform to v${{ steps.semver.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
          
          # Tag and push tag
          git tag -a "${{ steps.semver.outputs.tag_name }}" -m "Release ${{ steps.semver.outputs.tag_name }}"
          git push origin "${{ steps.semver.outputs.tag_name }}"

      # 16. Create GitHub Release with direct asset attachment (ZERO Actions Storage used)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            FLAGS="$FLAGS --draft"
          fi

          echo "🚀 Publishing GitHub Release ${{ steps.semver.outputs.tag_name }}..."
          gh release create "${{ steps.semver.outputs.tag_name }}" \
            "dist/pravah-v${{ steps.semver.outputs.version }}.zip" \
            "dist/pravah-${{ steps.semver.outputs.version }}.tgz" \
            "dist/SHA256SUMS.txt" \
            --title "PRAVAH ${{ steps.semver.outputs.tag_name }}" \
            --notes-file "dist/RELEASE_NOTES.md" \
            $FLAGS

      # 17. Publish Helm Chart to GitHub Repository (gh-pages)
      - name: Publish Helm Chart to GitHub Helm Repository
        run: |
          echo "📦 Publishing Helm Chart to GitHub repository (gh-pages branch)..."
          PAGES_DIR="$(mktemp -d)"

          # Clone gh-pages branch if it exists, otherwise initialize orphan branch
          if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$PAGES_DIR" 2>/dev/null; then
            echo "Found existing gh-pages branch."
          else
            echo "Initializing orphan gh-pages branch for Helm repository..."
            mkdir -p "$PAGES_DIR"
            cd "$PAGES_DIR"
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan gh-pages
            cd -
          fi

          # Copy packaged chart archive into gh-pages directory
          cp "dist/pravah-${{ steps.semver.outputs.version }}.tgz" "$PAGES_DIR/"

          # Generate / update index.yaml (merge with existing so past versions are preserved)
          if [ -f "$PAGES_DIR/index.yaml" ]; then
            helm repo index "$PAGES_DIR" --merge "$PAGES_DIR/index.yaml"
          else
            helm repo index "$PAGES_DIR"
          fi

          # Commit and push index.yaml and chart package to gh-pages branch
          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml "pravah-${{ steps.semver.outputs.version }}.tgz"
          if git diff --staged --quiet; then
            echo "No changes to commit on gh-pages."
          else
            git commit -m "chore(helm): release chart v${{ steps.semver.outputs.version }} [skip ci]"
            git push origin gh-pages
          fi
          cd -
          rm -rf "$PAGES_DIR"
          echo "✅ Helm chart repository successfully published to gh-pages branch."
